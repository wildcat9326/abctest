<html lang="ko">

.stk{position:sticky;top:8px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
.chip{border:2px solid #e6dff0;background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer;margin:3px;color:var(--ink)}

.chip.dot{display:inline-flex;align-items:center;gap:7px;padding:7px 14px 7px 8px}
.chip.dot i{width:22px;height:22px;border-radius:50%;border:1px solid #cfc8dc;display:inline-block}
.btn{background:var(--pk);color:#fff;border:0;border-radius:999px;padding:14px 26px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #d9506f;margin:4px}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 0 0 2px #d9d2e6}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;align-items:center}
.lab{font-weight:700;margin:12px 0 2px;color:#6b4fa0}
.av{width:100%;max-height:68vh;display:block;background:linear-gradient(#fff,#fdf0f6);border-radius:18px}
.bust{width:100%;max-width:340px;display:block;margin:0 auto;background:#fff7fb;border-radius:18px}
.note{background:#fff7e0;border-radius:14px;padding:10px 14px}
.soft{color:#7a7290}
.steps{padding-left:0;list-style:none}.steps li{margin:8px 0;background:#f7f3ff;border-radius:14px;padding:8px 14px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.pill{border:0;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px #a78bb533}
.pill.on{background:var(--pk);color:#fff;font-weight:700}
.nav2{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.mrow{display:flex;align-items:center;gap:8px;margin:9px 0}
.ml{width:104px;font-size:14px;font-weight:700;flex:none;line-height:1.25}.ml small{font-weight:400;color:#8a82a0;font-size:11px}
.mb{flex:1}.mb .mt+.mt{margin-top:4px}
.mv{width:62px;text-align:right;font-size:13px;color:#7a7290;flex:none}
.mood{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mood small{font-size:11px;color:#7a7290}.mood .mt+.mt{margin-top:3px}
.mt{position:relative;height:12px;background:#ece8f5;border-radius:8px;overflow:hidden}
.mt i{display:block;height:100%;border-radius:8px;transition:width .3s}
.mt i.a{background:#ff8fab}.mt i.b{background:#7b93ff}.mt i.g{background:var(--gr)}
.mt b{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff}
.gl{background:#f4f1fb;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px}.gl.ok{background:#e2f7ec}
.why li{margin:6px 0}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}
.gcard{border:3px solid #e6dff0;background:#fff;border-radius:20px;padding:18px 10px;font:inherit;font-size:17px;cursor:pointer;color:var(--ink)}
.gcard.on{border-color:var(--pk);background:var(--pk2);font-weight:700;box-shadow:0 0 0 4px #ff6f9133}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{background:#f4f1fb;border-radius:18px;padding:40px 14px;text-align:center;color:#7a7290}
input[type=text],textarea{width:100%;font:inherit;border:2px solid #e6dff0;border-radius:14px;padding:10px 12px;margin:4px 0}
textarea{min-height:130px;resize:vertical}
.ck{padding:6px 12px;border-radius:12px;background:#f4f1fb;margin:5px 0;font-size:14px}.ck.ok{background:#e2f7ec;font-weight:700}
#cardBox svg{width:100%;height:auto;display:block;border-radius:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#3a3350;color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){.grid,.hero{grid-template-columns:1fr}.stk{top:0;z-index:5}.stk .av{max-height:34vh}h1{font-size:1.9rem}.ml{width:84px}}
</style>
</head>

<div class="wrap"><div id="nav"></div><div id="app"></div></div>

function nav(){$('#nav').innerHTML=scr?`<div class="pills">${['아바타','색 대어 보기','목표','코디','비교','카드'].map((t,i)=>`<button class="pill${scr==i+1?' on':''}" data-a="go" data-v="${i+1}">${i+1}. ${t}</button>`).join('')}</div>`:''}
/* ---------- 화면 ---------- */
function startScr(){return`<div class="card hero"><div><h1>나를 살리는 코디 랩</h1><p style="font-size:1.2rem">몸을 고치는 게 아니라,<br><b>옷의 효과를 알고 나를 표현하는 것</b></p><ol class="steps"><li><b>① 나의 아바타 만들기</b> 나와 비슷한, 또는 원하는 캐릭터를 만들어요</li><li><b>② 색 대어 보기</b> 색 천을 대어 보며 인상의 차이를 관찰해요</li><li><b>③ 목표 고르고 코디하기</b> 연출 목표를 정하고 효과 미터로 확인해요</li><li><b>④ 설명하고 카드로 저장하기</b> 선·색·무늬·재질·실루엣으로 설명해요</li></ol><p class="note">사진이나 카메라는 쓰지 않아요. 모든 옷은 누구나 입을 수 있어요.</p><button class="btn" data-a="go" data-v="1">시작하기</button></div><div>${avSVG(st.S,st.O,'h')}</div></div>`}
function avScr(){const S=st.S,L=l=>`<div class="lab">${l}</div>`,ch=(k,a)=>a.map(([v,t])=>E('s',k,v,t,S[k]==v)).join(''),ix=(k,a)=>a.map((t,i)=>E('s',k,i,t,S[k]==i)).join('');
return`<div class="grid"><div class="card stk"><h3>내 아바타</h3>${avSVG(S,st.O,'m')}</div><div class="card"><h2>나의 아바타 설정</h2><p class="note">정답은 없어요. 나와 비슷하게, 또는 원하는 캐릭터로 만들어도 좋아요.</p>`+
L('얼굴형')+ch('face',[['round','둥근형'],['slim','갸름한형'],['square','각진형'],['long','긴형'],['heart','하트형']])+
L('피부톤 (밝은 톤 ~ 어두운 톤)')+`<div class="row">${SK.map((c,i)=>DOT('s','tone',i,c,S.tone==i,['1 밝은 톤','2','3','4','5','6 어두운 톤'][i])).join('')}</div>`+ch('under',[['y','노란 기'],['r','붉은 기']])+
L('머리 모양')+ch('hair',[['short','짧은 머리'],['bob','단발'],['long','긴 머리'],['pony','묶은 머리']])+
L('머리 색')+`<div class="row">${HC.map((c,i)=>DOT('s','hc',i,c,S.hc==i,['검정','갈색','밝은 갈색','회색'][i])).join('')}</div>`+
L('키')+ix('h',['작은 편','보통','큰 편'])+L('어깨')+ix('sh',['좁은 편','보통','넓은 편'])+L('체형 실루엣')+ch('sil',[['str','일자형'],['up','상체 볼륨형'],['low','하체 볼륨형'],['cur','곡선형']])+nv(0,2,'다음: 색 대어 보기 →')+`</div></div>`}
function drScr(){const cur=dr.cmp?[dr.L,dr.R]:[dr.one],inf=h=>{const p=PAL.find(x=>x[1]==h);return p?`<b>${p[0]}</b> → ${p[2]}`:''};
const grp=(g,t)=>`<div class="lab">${t}</div><div class="row">${PAL.filter(p=>p[3]==g).map(p=>DOT('dr','',p[1],p[1],cur.includes(p[1]),p[0])).join('')}</div>`;
const view=dr.cmp?`<div class="two"><div><div class="lab" style="text-align:center">왼쪽</div>${bust(st.S,dr.L)}<p>${inf(dr.L)}</p></div><div><div class="lab" style="text-align:center">오른쪽</div>${bust(st.S,dr.R)}<p>${inf(dr.R)}</p></div></div>`:`${bust(st.S,dr.one)}<p style="text-align:center">${inf(dr.one)}</p>`;
const sv=h=>`<button class="btn sub" data-a="sv" data-v="${h}">★ ${nameOf(h)} 담기</button>`;
return`<div class="grid"><div class="card stk"><h3>색 천을 대어 보기</h3>${view}<div class="row" style="justify-content:center">${E('dm','cmp','',dr.cmp?'비교 끄기':'비교하기',dr.cmp)}${dr.cmp?E('dm','side','L','왼쪽 천 고르기',dr.side=='L')+E('dm','side','R','오른쪽 천 고르기',dr.side=='R'):''}</div></div><div class="card"><h2>색 대어 보기</h2><p class="note">색을 번갈아 대어 보며 얼굴 느낌이 어떻게 달라지는지 스스로 관찰해 보세요. 정답은 없어요. 얼굴이 더 환해 보이는 색을 느낀 대로 골라요.</p><p class="soft">관찰 질문: 얼굴이 더 환해 보이나요? 눈빛이 또렷해 보이나요? 표정이 편안해 보이나요?</p>`+
grp('w','따뜻한 색 8')+grp('c','차가운 색 8')+grp('n','무채색 4')+`<div class="lab">내 얼굴이 더 환해 보이는 색 → 나의 색 (${st.my.length}/3)</div><div class="row">${(dr.cmp?sv(dr.L)+sv(dr.R):sv(dr.one))}</div><div class="row">${st.my.length?st.my.map(h=>`<span class="chip dot on"><i style="background:${h}"></i>★ ${nameOf(h)} <span data-a="rm" data-v="${h}" style="cursor:pointer;margin-left:6px">✕</span></span>`).join(''):'<span class="soft">아직 담은 색이 없어요. 코디 단계에서 맨 앞에 보여 줄게요.</span>'}</div>`+nv(1,3,'다음: 연출 목표 →')+`</div></div>`}
function goalScr(){return`<div class="card"><h2>연출 목표 고르기 <small class="soft">(최대 2개)</small></h2><p class="note">내가 표현하고 싶은 모습을 직접 골라요. 앱은 고른 목표에 맞는 옷의 효과만 안내해 줘요.</p><div class="gg">${GOALS.map(([k,t])=>`<button class="gcard${st.G.includes(k)?' on':''}" data-a="goal" data-k="${k}">${t}</button>`).join('')}</div><p>선택한 목표: ${st.G.length?st.G.map(g=>'<b>'+GL[g]+'</b>').join(', '):'아직 없어요'}</p>${nv(2,4,'다음: 코디하기 →',!st.G.length)}</div>`}
function coordiScr(){const O=st.O,S=st.S,{m,R}=calc(O,S),hs=hiSet(m,st.G,S);
const P={top:['상의',TOP,'top','topC'],bot:['하의',BOT,'bot','botC'],out:['겉옷',OUT,'outer','outC'],shoe:['신발',SHO,'shoe','shoeC']},p=P[tab];
const cols=f=>st.my.map(h=>DOT('o',f,h,h,O[f]==h,'★ '+nameOf(h))).join('')+BASE.filter(b=>!st.my.includes(b[1])).map(b=>DOT('o',f,b[1],b[1],O[f]==b[1],b[0])).join('');
let body=`<div class="row">${p[1].map(([v,t])=>E('o',p[2],v,t,O[p[2]]==v)).join('')}</div>`;
if(tab=='top'){body+=`<div class="lab">네크라인</div>`+(NK.includes(O.top)?`<div class="row">${NECK.map(([v,t])=>E('o','neck',v,t,O.neck==v)).join('')}</div>`:'<p class="soft">이 옷은 목 모양이 정해져 있어요. 라운드·V·터틀넥은 티셔츠, 니트, 맨투맨, 크롭 상의에서 바꿀 수 있어요.</p>');if(O.top=='shirt'||O.top=='plain')body+=`<div class="row">${E('ok','topK','',O.topK?'체크 무늬 빼기':'체크 무늬 입히기',O.topK)}</div>`}
if(tab=='bot'&&['wide','aline','hline'].includes(O.bot))body+=`<div class="row">${E('ok','botK','',O.botK?'체크 무늬 빼기':'체크 무늬 입히기',O.botK)}</div>`;
if(!(tab=='out'&&O.outer=='none'))body+=`<div class="lab">색 고르기 ${st.my.length?'(★ 나의 색이 맨 앞에 있어요)':''}</div><div class="row">${cols(p[3])}</div>`;
const rs=reasons(R,st.G);
return`<div class="grid"><div class="card stk"><h3>코디 룸</h3>${avSVG(S,O,'m')}</div><div><div class="card"><h2>코디하기</h2><div class="row">${Object.entries(P).map(([k,v])=>E('tab','',k,v[0],tab==k)).join('')}</div>${body}</div>
<div class="card"><h2>효과 미터</h2>${meterHTML([{m,hs,c:'b'}])}<div class="lab">내 연출 목표</div>${goalBlock(m,S)}<div class="lab">지금 코디에서 효과를 낸 요소</div><ul class="why">${rs.map(t=>`<li>${t}</li>`).join('')}</ul></div>
<div class="card"><div class="row"><button class="btn sub" data-a="slot" data-k="A">A안 저장</button><button class="btn sub" data-a="slot" data-k="B">B안 저장</button><button class="btn" data-a="go" data-v="5">비교하기 →</button><button class="btn" data-a="card" data-k="cur">카드 만들기 →</button></div><p class="soft">저장한 A안: ${st.A?'있어요':'아직 없어요'} / B안: ${st.B?'있어요':'아직 없어요'}</p></div></div></div>`}
function cmpScr(){const sl=['A','B'].filter(k=>st[k]).map(k=>{const s=st[k],{m}=calc(s.O,s.S);return{k,s,m,hs:hiSet(m,st.G,s.S),c:k=='A'?'a':'b'}});
const col=k=>{const s=st[k];return`<div class="card"><h3>${k}안 ${k=='A'?'(분홍 막대)':'(파랑 막대)'}</h3>${s?avSVG(s.S,s.O,k):`<div class="ph">아직 저장한 코디가 없어요.<br>코디하기에서 ${k}안 저장을 눌러 주세요.</div>`}${s?`<div class="row" style="justify-content:center"><button class="btn sub" data-a="load" data-k="${k}">불러와서 고치기</button><button class="btn" data-a="card" data-k="${k}">이 안으로 카드</button></div>`:''}</div>`};
return`<div class="two">${col('A')}${col('B')}</div><div class="card"><h2>A안 · B안 효과 비교</h2>${sl.length?meterHTML(sl)+'<p class="soft">초록색 막대는 내가 고른 목표 쪽으로 움직인 미터예요. 두 코디의 차이를 말로 설명해 보세요.</p>':'<p class="soft">A안과 B안을 저장하면 미터를 나란히 비교할 수 있어요.</p>'}${nv(4,6,'다음: 설명과 카드 →')}</div>`}
function chk(){const t=st.text.trim(),len=[...t].length,found=['선','색','무늬','재질','실루엣'].filter(w=>w=='선'?/선(?!택)/.test(t):t.includes(w));return{len,found,ok1:len>=30,ok2:found.length>=2,ok3:/키|다리|어깨|균형|얼굴|인상|갸름|길어|넓어|좁아/.test(t)}}
function updChecks(){const c=chk();$('#chk').innerHTML=`<div class="ck ${c.ok1?'ok':''}">${c.ok1?'✔':'○'} 30자 이상 쓰기 (지금 ${c.len}자)${c.ok1?'':' — 조금만 더 써 볼까요?'}</div><div class="ck ${c.ok2?'ok':''}">${c.ok2?'✔':'○'} 선·색·무늬·재질·실루엣 낱말 2개 이상 (찾은 낱말: ${c.found.join(', ')||'아직 없어요'})${c.ok2?'':' — 낱말을 더 넣어 보세요'}</div><div class="ck ${c.ok3?'ok':''}">${c.ok3?'✔':'○'} 연출 목표와 연결해서 쓰기</div>`;$('#cardBox').innerHTML=cardSVG()}
function cardScr(){return`<div class="grid"><div class="card"><h2>나의 코디 설명</h2><p class="soft">어떤 목표를 위해 어떤 디자인 요소(선·색·무늬·재질·실루엣)를 썼는지 써 보세요.</p><input type="text" id="nm" maxlength="12" placeholder="내 이름(또는 별명)" value="${esc(st.nm)}"><input type="text" id="tt" maxlength="16" placeholder="코디 이름 (예: 키 쑥쑥 코디)" value="${esc(st.tt)}"><textarea id="tx" placeholder="예) 키가 커 보이는 목표를 위해 세로 줄무늬(무늬)와 위아래 비슷한 색(색)을 골라 세로선이 이어지게 했어요.">${esc(st.text)}</textarea><div class="lab">자기점검 체크리스트</div><div id="chk"></div>${nv(5,null)}</div><div class="card"><div id="cardBox"></div><div class="row" style="justify-content:center"><button class="btn" data-a="png">이미지로 저장</button><button class="btn sub" data-a="reset">처음부터 다시</button></div></div></div>`}
/* ---------- 코디 카드(SVG) ---------- */
function wrap(t,max){const out=[];let line='',w=0;for(const ch of t){if(ch=='\n'){out.push(line);line='';w=0;continue}const cw=/[\x00-\x7f]/.test(ch)?.55:1;if(w+cw>max){out.push(line);line='';w=0}line+=ch;w+=cw}if(line)out.push(line);return out}
function cardSVG(){const F=st.F||{S:st.S,O:st.O},{m}=calc(F.O,F.S),hs=hiSet(m,st.G,F.S),W=840,H=610,bc=k=>hs.has(k)?'#22b573':'#8da2fb',
rect=(x,y,w,c)=>`<rect x="${x}" y="${y}" width="${w}" height="12" rx="6" fill="#ece8f5"/><rect x="${x}" y="${y}" width="${w*m[c]/100}" height="12" rx="6" fill="${bc(c)}"/><rect x="${x+w/2-1}" y="${y}" width="2" height="12" fill="#fff"/>`;
let gx=290,goals='';st.G.forEach(g=>{const w=GL[g].length*14+26,ok=goalState(g,m,F.S);goals+=`<rect x="${gx}" y="108" width="${w}" height="28" rx="14" fill="${ok?'#d6f5e5':'#ffe3ec'}"/><text x="${gx+13}" y="127" font-size="14" font-weight="700" fill="#3a3350">${ok?'✔ ':''}${GL[g]}</text>`;gx+=w+8});
let ms=MET.map(([k,l],i)=>`<text x="290" y="${196+i*36}" font-size="14" font-weight="700" fill="#3a3350">${l}</text>${rect(430,185+i*36,340,k)}`).join('');
ms+=`<text x="290" y="344" font-size="14" font-weight="700" fill="#3a3350">인상</text>`+MD.map(([k,l],i)=>`<text x="${430+i*114}" y="334" font-size="11" fill="#6b6385">${l}</text>${rect(430+i*114,340,104,k)}`).join('');
let lines=wrap(st.text.trim()||'여기에 나의 코디 설명이 나타나요.',31);if(lines.length>6){lines=lines.slice(0,6);lines[5]=lines[5].slice(0,-1)+'…'}
return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1f6"/><stop offset="1" stop-color="#eaf1ff"/></linearGradient></defs><rect width="${W}" height="${H}" rx="28" fill="url(#cg)"/><text x="34" y="52" font-size="26" font-weight="700" fill="#ff6f91">나를 살리는 코디 랩</text><text x="${W-34}" y="50" font-size="15" text-anchor="end" fill="#6b6385">중학교 가정 · 코디 카드</text><rect x="30" y="76" width="240" height="500" rx="22" fill="#fff"/><svg x="40" y="96" width="220" height="440" viewBox="0 0 200 400">${inner(F.S,F.O,'cd')}</svg><text x="290" y="92" font-size="24" font-weight="700" fill="#3a3350">${esc(st.nm||'나')}의 코디${st.tt?' · '+esc(st.tt):''}</text>${goals}${ms}<rect x="290" y="362" width="520" height="214" rx="16" fill="#fff" opacity=".85"/><text x="308" y="388" font-size="16" font-weight="700" fill="#ff6f91">나의 코디 설명</text>${lines.map((l,i)=>`<text x="308" y="${414+i*24}" font-size="15" fill="#3a3350">${esc(l)}</text>`).join('')}</svg>`}
function savePNG(){const s=$('#cardBox svg').cloneNode(true);s.removeAttribute('style');const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1680;c.height=1220;c.getContext('2d').drawImage(img,0,0,1680,1220);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(st.nm||'나')+'의_코디카드.png';a.click()})};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s))}
/* ---------- 동작 ---------- */
let tmr;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('on'),2800)}
function act(a,k,v){let top=false;
switch(a){
case'go':scr=+v;st.F=null;top=true;break;
case's':st.S[k]=['tone','hc','h','sh'].includes(k)?+v:v;break;
case'o':st.O[k]=v;break;
case'ok':st.O[k]=st.O[k]?0:1;break;
case'tab':tab=v;break;
case'dr':if(dr.cmp){dr[dr.side]=v;dr.side=dr.side=='L'?'R':'L'}else dr.one=v;break;
case'dm':if(k=='cmp')dr.cmp=dr.cmp?0:1;else dr.side=v;break;
case'sv':if(st.my.includes(v))toast('이미 나의 색에 담았어요.');else if(st.my.length>=3)toast('나의 색은 3개까지 담을 수 있어요. ✕를 눌러 하나를 비우면 새로 담을 수 있어요.');else{st.my.push(v);toast(nameOf(v)+' 색을 나의 색에 담았어요!')}break;
case'rm':st.my=st.my.filter(h=>h!=v);break;
case'goal':if(st.G.includes(k))st.G=st.G.filter(g=>g!=k);else if(st.G.length>=2)toast('목표는 2개까지 고를 수 있어요. 하나를 해제하면 다른 목표를 고를 수 있어요.');else st.G.push(k);break;
case'slot':st[k]={S:clone(st.S),O:clone(st.O)};toast(k+'안을 저장했어요! 다른 코디를 만들어 '+(k=='A'?'B':'A')+'안에도 저장해 보세요.');break;
case'load':st.S=clone(st[k].S);st.O=clone(st[k].O);scr=4;top=true;break;
case'card':st.F=k=='cur'?clone({S:st.S,O:st.O}):clone(st[k]);scr=6;top=true;break;
case'png':savePNG();return;
case'reset':if(confirm('처음부터 다시 시작할까요? 지금까지 만든 내용이 모두 지워져요.')){st=D0();scr=0;tab='top';dr={cmp:0,side:'L',one:'#ff7f6e',L:'#ff7f6e',R:'#b9a6e8'};top=true}else return;break}
render(top)}
function render(top){const y=scrollY;nav();$('#app').innerHTML=[startScr,avScr,drScr,goalScr,coordiScr,cmpScr,cardScr][scr]();if(scr==6)updChecks();scrollTo(0,top?0:y)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.k,b.dataset.v)});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='nm')st.nm=e.target.value;else if(i=='tt')st.tt=e.target.value;else if(i=='tx')st.text=e.target.value;else return;updChecks()});
render(true);
</script>
</body>
</html>
